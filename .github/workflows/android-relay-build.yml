name: Build MAX TV RELAIS ANDROID 01 APK
on:
  push:
    branches:
      - feature/max-tv-android-relay-01
      - main
    paths:
      - 'android-relay/**'
      - '.github/workflows/android-relay-build.yml'
  pull_request:
    paths:
      - 'android-relay/**'
      - '.github/workflows/android-relay-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer SDK 35 (outils déjà présents sur Ubuntu)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Tests et APK debug
        run: gradle --no-daemon --stacktrace -p android-relay :app:testDebugUnitTest :app:assembleDebug
      - name: Vérifier la sortie
        run: |
          test -s android-relay/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-relay/app/build/outputs/apk/debug/app-debug.apk
      - name: Publier APK dans le run GitHub
        uses: actions/upload-artifact@v4
        with:
          name: MAX-TV-RELAIS-ANDROID-01-APK
          path: android-relay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
