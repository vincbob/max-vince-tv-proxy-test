name: Validation du laboratoire proxy VIDAA
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Valider la syntaxe JavaScript
        run: |
          node --check proxy-lab.js
          node --check direct-check.js
      - name: Simuler le navigateur sans secrets
        run: node --test tests/proxy-lab.test.js tests/direct-check.test.js
